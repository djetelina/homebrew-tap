name: Auto-update formulae

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Configure git author
        run: git config --global user.name "github-actions[bot]"

      - name: Discover formulae
        id: discover
        run: |
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          formulae=""
          for f in Formula/*.rb; do
            name="$(basename "$f")"
            formulae+="${name%.rb} "
          done
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"

      - name: Bump packages
        uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fork: false
          formulae: ${{ steps.discover.outputs.formulae }}
