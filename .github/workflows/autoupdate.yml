name: Auto-update formulae

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Discover formulae
        id: discover
        run: |
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          echo "formulae=$(ls Formula/*.rb | xargs -n1 basename | sed 's/\.rb$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Bump packages
        uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fork: false
          formulae: ${{ steps.discover.outputs.formulae }}
